[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clube-tenis-api"
version = "0.1.0"
description = "API do clube de tênis — US01"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0.40,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "email-validator>=2.2,<3",
    "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requer PostgreSQL exclusivo para testes"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
